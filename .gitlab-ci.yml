stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # npm-common-config follows ccc's develop (.gitmodules `branch`), so a catalog
  # bump there reaches the next pipeline
  GIT_SUBMODULE_UPDATE_FLAGS: --remote

# Branch pipelines, except for AIDEV-driven development: ai/<issue>-...,
# session/<name> and aidev/integration are verified by the suites in
# .aidev/project.yaml, not by CI. A push to aidev/integration runs no pipeline;
# one started by hand or through the API does (`glab ci run -b aidev/integration`),
# which is how its MR into main gets a pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(ai|session)\//
      when: never
    - if: $CI_COMMIT_BRANCH == "aidev/integration" && $CI_PIPELINE_SOURCE !~ /^(web|api)$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

include:
  - project: 'hive/common-ci-configuration'
    ref: develop
    file:
      - '/templates/npm_projects.gitlab-ci.yml'

# The only runner taking untagged jobs is down; this also covers jobs from the
# included ccc templates.
default:
  tags: [public-runner-docker]

# Frozen install (with ccc's catalog-mismatch fallback) and a type check of every
# snippet under src/ (tsconfig.json)
typecheck:
  stage: build
  extends: .npm_based_job_base
  image: "${NODE_TEST_TOOLS_IMAGE}"
  script:
    - pnpm exec tsc --noEmit
